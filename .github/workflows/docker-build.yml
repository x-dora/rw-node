# Docker 镜像构建工作流
name: Docker Build

on:
  workflow_call:
    inputs:
      version:
        description: '要构建的版本号'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve rw-node-go version
        id: go_version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .go-paas-version)"
          if [[ -z "$version" ]]; then
            echo "::error::Unable to resolve rw-node-go version from .go-paas-version"
            exit 1
          fi
          version_stripped="${version#v}"
          echo "version=$version_stripped" >> "$GITHUB_OUTPUT"
          echo "version_raw=$version" >> "$GITHUB_OUTPUT"

      # 固定 Caddy 版本作为 build-arg:CADDY_VERSION=latest 每次解析到新 tag
      # 会让 buildx 层缓存必然失效;固定 tag 后 gha 缓存可跨构建命中,
      # Caddy 编译层(最耗时)整体跳过。缓存未命中时也会走 Actions 的
      # cache mount(/go/pkg/mod、/root/.cache/go-build)复用编译产物。
      - name: Resolve Caddy version
        id: caddy_version
        run: |
          set -euo pipefail
          caddy_version="$(curl -fsSL https://api.github.com/repos/caddyserver/caddy/releases/latest | jq -r '.tag_name')"
          if [[ -z "$caddy_version" || "$caddy_version" == "null" ]]; then
            echo "::warning::Unable to resolve latest Caddy version; falling back to latest"
            caddy_version="latest"
          fi
          echo "caddy_version=${caddy_version}" >> "$GITHUB_OUTPUT"
          echo "Resolved Caddy version: ${caddy_version}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.go_version.outputs.version }}
            type=raw,value=${{ steps.go_version.outputs.version }}-go-paas
            type=raw,value=latest
            type=raw,value=latest-go-paas
          labels: |
            org.opencontainers.image.description=Go Implementation PaaS HTTPS Direct

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CADDY_VERSION=${{ steps.caddy_version.outputs.caddy_version }}
            RW_NODE_GO_VERSION=${{ steps.go_version.outputs.version_raw }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Summary
        run: |
          echo "## Docker Images Built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | Description |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`ghcr.io/${{ github.repository }}:latest\` | Go Implementation PaaS HTTPS Direct |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`ghcr.io/${{ github.repository }}:latest-go-paas\` | Go Implementation PaaS HTTPS Direct (alias) |" >> "$GITHUB_STEP_SUMMARY"
